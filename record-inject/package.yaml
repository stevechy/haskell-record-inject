name:                record-inject
version:             0.1.0.0
github:              "stevechy/record-inject"
license:             BSD-3-Clause
author:              "Steven Cheng Hum Yuen"
maintainer:          "example@example.com"
copyright:           "Copyright (c) 2026 Steven Cheng Hum Yuen"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/githubuser/record-inject#readme>

dependencies:
- base >= 4.7 && < 5
- containers
- template-haskell

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints
- -dth-dec-file

library:
  source-dirs: src

executables:
  record-inject-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - record-inject

tests:
  record-inject-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - record-inject
